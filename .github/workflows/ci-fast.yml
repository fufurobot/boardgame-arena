# Fast feedback CI.
#
# Branch model:
#   dev  -> fast tests only (this workflow). It is expected to be green
#           most of the time, but a red dev is not a release blocker.
#   main -> full tests (ci.yml).
#   tags -> publish artifacts (publish.yml).
name: FBG-CI-fast

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Codegen
        run: bun run codegen
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
